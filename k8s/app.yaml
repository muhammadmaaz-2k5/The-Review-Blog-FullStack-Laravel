apiVersion: apps/v1
kind: Deployment
metadata:
  name: nazaarabox-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nazaarabox
  template:
    metadata:
      labels:
        app: nazaarabox
    spec:
      initContainers:
        - name: copy-code
          image: nazaarabox-app:latest
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'cp -r /var/www/html/* /shared/']
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      containers:
        - name: app
          image: nazaarabox-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: laravel-env
          volumeMounts:
            - name: shared-data
              mountPath: /var/www/html
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-data
              mountPath: /var/www/html
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: nginx-config-volume
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nazaarabox-web
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: nazaarabox
