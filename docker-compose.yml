version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nazaarabox-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      # Don't overwrite the vendor and node_modules built in the image
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/public/build
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - APP_ENV=local
      - APP_DEBUG=true
      # Make sure to generate an app key if this is missing!
      # You can run: docker-compose exec app php artisan key:generate
    networks:
      - nazaarabox-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nazaarabox-network

networks:
  nazaarabox-network:
    driver: bridge
