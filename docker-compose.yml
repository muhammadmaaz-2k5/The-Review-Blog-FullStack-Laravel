version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nazaarabox-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      # Don't overwrite the vendor and node_modules built in the image
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/public/build
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - APP_ENV=local
      - APP_DEBUG=true
      # Make sure to generate an app key if this is missing!
      # You can run: docker-compose exec app php artisan key:generate
    depends_on:
      - db
    networks:
      - nazaarabox-network

  db:
    image: mysql:${MYSQL_VERSION:-latest}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nazaarabox-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nazaarabox-network

networks:
  nazaarabox-network:
    driver: bridge

volumes:
  mysql_data:
